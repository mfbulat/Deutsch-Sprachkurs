<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zwischentest Training A1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
/*
VOICE: спокойный экзаменационный бланк — как Moodle, но с объяснениями
IDEA: австрийский Prüfungsbogen — белый лист, красно-бело-красная полоса, крупный номер вопроса
PICTURE: сам тест — карточка вопроса и полоса клеток прогресса
COLOUR and TYPE: белый лист, чернила #17181c, австрийский красный как единственный акцент; Archivo + Source Sans 3
LAYOUT: колонка 780px; на телефоне то же в одну колонку
*/
:root{color-scheme:light dark;--bg:light-dark(#f4f2ee,#121315);--paper:light-dark(#ffffff,#1c1d21);--ink:light-dark(#17181c,#ecebe7);--mute:light-dark(#62646b,#a2a4ab);--line:light-dark(#dedbd4,#33353b);--red:light-dark(#c8102e,#ff5a6e);--ok:light-dark(#1b7a45,#5fd393);--okbg:light-dark(#e6f4ec,#173324);--bad:light-dark(#b3261e,#ff8a80);--badbg:light-dark(#fbeceb,#3a1d1b);--part:light-dark(#b26b00,#f0b85a);--partbg:light-dark(#fdf3dc,#3a2f12);--chip:light-dark(#f1efe9,#2a2c31)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 "Source Sans 3",system-ui,sans-serif;overflow-x:clip}
.flag{height:10px;background:linear-gradient(var(--red) 0 33%,var(--paper) 33% 66%,var(--red) 66%)}
.wrap{max-width:780px;margin:0 auto;padding:clamp(18px,4vw,40px) max(4vw,14px) 60px}
h1,h2{font-family:Archivo,system-ui,sans-serif;line-height:1.08;text-wrap:balance;margin:0}
h1{font-size:clamp(30px,6vw,44px);font-weight:800}
h2{font-size:22px;font-weight:700}
.sub{color:var(--mute);margin:8px 0 0}
.paper{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:clamp(18px,4vw,32px);margin-top:18px;box-shadow:0 12px 30px -24px rgba(0,0,0,.35)}
.bar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.timer{font:700 22px Archivo,sans-serif;font-variant-numeric:tabular-nums;white-space:nowrap}
.timer.low{color:var(--red)}
.cells{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:5px;margin-top:14px}
.cells button{height:32px;border-radius:6px;border:1px solid var(--line);background:var(--chip);color:var(--mute);font:600 12px Archivo,sans-serif;cursor:pointer;padding:0}
.cells button.cur{border-color:var(--ink);color:var(--ink);background:var(--paper);box-shadow:inset 0 0 0 1px var(--ink)}
.cells button.done{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.cells button.r{background:var(--ok);border-color:var(--ok);color:#fff}.cells button.w{background:var(--bad);border-color:var(--bad);color:#fff}.cells button.p{background:var(--part);border-color:var(--part);color:#fff}
.cells button:disabled{cursor:default}
.qno{display:flex;gap:14px;align-items:baseline}
.qno b{font:800 46px/1 Archivo,sans-serif;color:var(--red)}
.qno span{color:var(--mute);font-size:15px}
.prompt{font-size:19px;margin:14px 0 18px;white-space:pre-line}
.opt{display:flex;gap:12px;align-items:center;min-height:48px;padding:10px 14px;border:1px solid var(--line);border-radius:10px;margin:8px 0;cursor:pointer}
.opt:hover{border-color:var(--mute)}
.opt input{width:20px;height:20px;accent-color:var(--red);flex:none}
.opt.sel{border-color:var(--ink)}
input[type=text],textarea,select{font:16px "Source Sans 3",sans-serif;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
.inl{display:inline-block;width:8.5em!important;margin:4px 3px;padding:6px 8px!important}
select{width:auto;min-width:130px;min-height:44px}
textarea{min-height:190px;resize:vertical}
input:focus-visible,textarea:focus-visible,select:focus-visible,button:focus-visible,.opt:focus-within{outline:2px solid var(--red);outline-offset:2px}
.grid{font:700 18px/1.4 ui-monospace,Menlo,monospace;letter-spacing:.12em;background:var(--chip);border-radius:10px;padding:14px;overflow-wrap:anywhere;margin-bottom:14px}
.mrow{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.tfb{display:flex;gap:6px}
.tfb button{min-height:40px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font:600 15px "Source Sans 3",sans-serif;cursor:pointer}
.tfb button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.text{line-height:2.4}
.gap{display:inline-flex;align-items:center;justify-content:center;min-width:112px;min-height:38px;padding:2px 10px;margin:0 3px;border:1.5px dashed var(--mute);border-radius:8px;vertical-align:middle;cursor:pointer;background:var(--paper);color:var(--ink);font:600 16px "Source Sans 3",sans-serif;line-height:1.2}
.gap.full{border-style:solid;border-color:var(--ink);background:var(--chip)}
.gap.act{border-color:var(--red);border-style:solid}
.bank,.tiles,.built{display:flex;flex-wrap:wrap;gap:8px}
.bank{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.built{min-height:56px;padding:8px;border:1.5px dashed var(--mute);border-radius:10px;margin-bottom:12px;align-items:center}
.chipw{min-height:40px;padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--chip);color:var(--ink);font:600 16px "Source Sans 3",sans-serif;cursor:pointer}
.chipw.used{opacity:.3}
.built .chipw{background:var(--paper);border-color:var(--ink)}
.hint{font-size:14px;color:var(--mute);margin-top:10px}
.keys{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.keys button{width:40px;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--chip);color:var(--ink);font:600 17px "Source Sans 3",sans-serif;cursor:pointer}
.passage{background:var(--chip);border-radius:10px;padding:16px 18px;white-space:pre-line;margin-bottom:16px;font-size:17px}
.audio{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--chip);border-radius:10px;padding:14px;margin-bottom:16px}
.play{width:56px;height:56px;border-radius:50%;border:0;background:var(--red);color:#fff;cursor:pointer;display:grid;place-items:center;flex:none}
.play:disabled{opacity:.35;cursor:not-allowed}
.play svg{width:22px;height:22px}
.script{font-size:15px;margin-top:10px}
.script p{margin:2px 0}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.btn{min-height:46px;padding:0 20px;border-radius:10px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);font:700 16px Archivo,sans-serif;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.sm{min-height:40px;padding:0 14px;font-size:15px}
.tests{display:grid;gap:12px;margin-top:20px}
.tcard{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 16px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.tcard h2{font-size:21px}
.tcard p{margin:4px 0 0;color:var(--mute);font-size:15px}
.tcard .btns{margin:0}
.last{font-size:14px;color:var(--ink)}
.fb{margin-top:18px;border-radius:10px;padding:14px 16px;font-size:16px}
.fb.r{background:var(--okbg)}.fb.w{background:var(--badbg)}.fb.p{background:var(--partbg)}
.fb b.t{display:block;margin-bottom:4px;font-family:Archivo,sans-serif}
.fb .ans{font-weight:600}
.fb p{margin:6px 0 0}
.score{font:800 clamp(56px,14vw,96px)/1 Archivo,sans-serif;color:var(--red)}
.note{font-size:14px;color:var(--mute)}
.rq{padding:12px 0;border-bottom:1px solid var(--line)}
.rq summary{cursor:pointer;display:flex;gap:10px;align-items:baseline;list-style:none}
.rq summary::-webkit-details-marker{display:none}
.dot{flex:none;width:12px;height:12px;border-radius:50%;transform:translateY(1px)}
.theory h3{font:700 19px Archivo,sans-serif;margin:26px 0 8px}.theory h3:first-child{margin-top:0}
.theory p,.theory ul{margin:8px 0}.theory li{margin:4px 0}
.tb{border-collapse:collapse;width:100%;margin:10px 0;font-size:16px}.tb th,.tb td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}.tb th{background:var(--chip);font-weight:600}
.tbw{overflow-x:auto}
.tip{background:light-dark(#eef5f1,#16261d);border-left:4px solid var(--ok);border-radius:8px;padding:10px 14px;margin:12px 0}
.err{background:var(--badbg);border-left:4px solid var(--bad);border-radius:8px;padding:10px 14px;margin:12px 0}
.cheat{margin-top:14px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.cheat summary{cursor:pointer;font:700 16px Archivo,sans-serif}
.sec{font:800 13px Archivo,sans-serif;color:var(--red);margin:34px 0 0;letter-spacing:.02em}
.prog{height:6px;border-radius:3px;background:var(--chip);margin-top:8px;overflow:hidden;max-width:260px}.prog i{display:block;height:100%;background:var(--ok)}
.decks{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-top:20px}
.deck{text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer;color:var(--ink);font:inherit;min-height:84px}
.deck:hover{border-color:var(--ink)}.deck b{display:block;font:700 16px Archivo,sans-serif}.deck span{font-size:14px;color:var(--mute)}
.deck.hard{border-color:var(--red)}
.fc{perspective:1200px;margin-top:18px;cursor:pointer;user-select:none}
.fcin{position:relative;min-height:300px;transition:transform .45s;transform-style:preserve-3d}
.fc.flip .fcin{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;background:var(--paper);border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;text-align:center;box-shadow:0 14px 34px -26px rgba(0,0,0,.45)}
.face.back{transform:rotateY(180deg)}
.word{font:800 clamp(30px,8vw,46px)/1.1 Archivo,sans-serif;overflow-wrap:anywhere}
.word .m{color:light-dark(#1d5fbf,#7fb0ff)}.word .f{color:var(--red)}.word .n{color:var(--ok)}
.pl{margin-top:10px;color:var(--mute);font-size:17px}
.tr{font:700 clamp(24px,6vw,34px)/1.2 Archivo,sans-serif}.tr2{margin-top:8px;color:var(--mute);font-size:18px}
.say{margin-top:18px;width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:var(--chip);color:var(--ink);cursor:pointer;display:grid;place-items:center}
.say svg{width:20px;height:20px}
.fcbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}.seg button{min-height:40px;padding:0 14px;border:0;background:var(--paper);color:var(--ink);font:600 14px "Source Sans 3",sans-serif;cursor:pointer}.seg button.on{background:var(--ink);color:var(--paper)}
.kb{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.kb .btn{min-height:56px}
.legend{font-size:14px;color:var(--mute);margin-top:8px}.legend b.m{color:light-dark(#1d5fbf,#7fb0ff)}.legend b.f{color:var(--red)}.legend b.n{color:var(--ok)}
@media(prefers-reduced-motion:reduce){.fcin{transition:none}}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-size:15px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
@media(prefers-reduced-motion:reduce){.toast{transition:none}}
@media(max-width:600px){.qno b{font-size:38px}.gap{min-width:96px}.tcard{grid-template-columns:minmax(0,1fr)}}
</style>
</head>
<body>
<div class="flag"></div>
<main class="wrap" id="app"><p>Loading …</p></main>
<div class="toast" id="toast"></div>
<script src="tests.js"></script>
<script src="lessons.js"></script>
<script src="lessons2.js"></script>
<script src="vocab.js"></script>
<script>
{
const TESTS=window.TESTS||[],LESSONS=window.LESSONS||[],ALL=TESTS.concat(LESSONS);
function buildMix(ref){return {id:'MIX',title:'Mix of all chapters',items:ref.map(([l,i])=>LESSONS.find(x=>x.id===l).items[i]),ref}}
function newMix(n){const all=[];LESSONS.forEach(l=>l.items.forEach((_,i)=>all.push([l.id,i])));return buildMix(shuffle(all).slice(0,n))}
const LIMIT=60*60;
const app=document.getElementById('app');
let T=null,S=null,tick=null,lastInput=null;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>(s||'').toLowerCase().replace(/[’'„“"«».,!?;:()]/g,' ').replace(/[–—-]/g,' ').replace(/\s+/g,' ').trim();
const key=id=>'zt-a1-'+id;
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1900)}
function copy(t,msg){if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>toast(msg),()=>toast('Could not copy'));else toast('Copy not available')}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const save=()=>store.set(key(T.id),S);

/* ---------- оценка ---------- */
function rowsScore(rows,a){if(!a)return 0;let c=0;rows.forEach((r,k)=>{if(a[k]===r[1])c++});return c/rows.length}
function grade(q,a){
 const empty=a==null||a===''||(Array.isArray(a)&&!a.some(x=>x!=null&&x!==''));
 if(q.t==='essay')return empty?0:null;
 if(empty)return 0;
 switch(q.t){
  case 'mc':return a===q.a?1:0;
  case 'tf':return a===q.a?1:0;
  case 'fill':
   if(q.set){const got=new Set(String(a).split(/[,;\n]+/).map(norm));return q.set.filter(w=>got.has(w)).length/q.set.length}
   return q.a.map(norm).includes(norm(a))?1:0;
  case 'short':return q.a.includes(norm(a))?1:0;
  case 'multi':{let c=0;q.a.forEach((acc,k)=>{if(acc.map(norm).includes(norm(a[k])))c++});return c/q.a.length}
  case 'sel':{let c=0;q.rows.forEach((r,k)=>{if(a[k]===r[1])c++});return c/q.rows.length}
  case 'gap':{let c=0;q.a.forEach((x,k)=>{if(a[k]===x)c++});return c/q.a.length}
  case 'order':{const s=norm(a.map(i=>q.w[i]).join(' '));return q.a.includes(s)?1:0}
  case 'read':return rowsScore(q.rows,a);
  case 'listen':return q.rows?rowsScore(q.rows,a):(a===q.a?1:0);
 }
 return 0;
}
const cls=g=>g===null?'p':g>=1?'r':g>0?'p':'w';

/* ---------- озвучка ---------- */
let voices=[];
function loadVoices(){try{voices=speechSynthesis.getVoices().filter(v=>/^de/i.test(v.lang));voices.sort((a,b)=>(/de-AT/i.test(b.lang)-/de-AT/i.test(a.lang)))}catch(e){voices=[]}}
try{loadVoices();speechSynthesis.onvoiceschanged=loadVoices}catch(e){}
function speak(lines,done){
 try{
  speechSynthesis.cancel();
  const roles=[...new Set(lines.map(l=>l[0]))];
  lines.forEach((l,i)=>{
   const u=new SpeechSynthesisUtterance(l[2]||l[1]);u.lang='de-DE';u.rate=.88;
   const r=roles.indexOf(l[0]);
   if(voices.length){u.voice=voices[r%voices.length];u.lang=u.voice.lang}
   if(voices.length<2)u.pitch=r%2?0.8:1.15;
   if(i===lines.length-1)u.onend=done;
   speechSynthesis.speak(u);
  });
  return true;
 }catch(e){return false}
}
const canSpeak=()=>'speechSynthesis' in window;

function makePerm(t){const p={};t.items.forEach((q,i)=>{const n=q.t==='gap'?q.bank.length:q.t==='order'?q.w.length:q.o?q.o.length:0;if(n)p[i]=shuffle([...Array(n).keys()])});return p}
const P=(qi,n)=>(S.perm&&S.perm[qi])||[...Array(n).keys()];
/* ---------- главная ---------- */

/* ---------- flashcards ---------- */
const VOCAB=window.VOCAB||[];
const vk=w=>w[0];
const fcStore={get(){return store.get('zt-fc')||{}},set(v){store.set('zt-fc',v)}};
function deckCards(){
 const st=fcStore.get(),all=uniq(VOCAB.flatMap(d=>d.w)),known=w=>(st[vk(w)]||0)>0,hard=all.filter(w=>(st[vk(w)]||0)<0);
 const main=VOCAB.filter(d=>!d.extra),ex=VOCAB.filter(d=>d.extra);
 const one=(id,t,ws,c)=>`<button class="deck ${c||''}" data-deck="${id}"><b>${esc(t)}</b><span>${ws.length} words · known ${ws.filter(known).length}</span></button>`;
 return one('ALL','All lesson words',uniq(main.flatMap(d=>d.w)))+(hard.length?one('HARD','Hard words (“don’t know”)',hard,'hard'):'')+main.map(d=>one(d.id,d.t,d.w)).join('')+ex.map(d=>one(d.id,d.t+' ★',d.w)).join('');
}
const uniq=ws=>[...new Map(ws.map(w=>[vk(w),w])).values()];
function deckWords(id){const st=fcStore.get();if(id==='ALL')return uniq(VOCAB.filter(d=>!d.extra).flatMap(d=>d.w));if(id==='HARD')return uniq(VOCAB.flatMap(d=>d.w).filter(w=>(st[vk(w)]||0)<0));if(id==='HARD')return VOCAB.flatMap(d=>d.w).filter(w=>(st[vk(w)]||0)<0);return (VOCAB.find(d=>d.id===id)||{w:[]}).w}
function deckTitle(id){return id==='ALL'?'All lesson words':id==='HARD'?'Hard words':(VOCAB.find(d=>d.id===id)||{}).t}
let F=null;
function colorDe(s){return esc(s).replace(/^(der)\b/,'<span class="m">der</span>').replace(/^(die)\b/,'<span class="f">die</span>').replace(/^(das)\b/,'<span class="n">das</span>')}
function sayDe(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/\(.*?\)/g,'').replace(/…/g,''));u.lang='de-DE';u.rate=.85;if(voices.length){u.voice=voices[0];u.lang=voices[0].lang}speechSynthesis.speak(u)}catch(e){}}
function openDeck(id,words){
 const ws=words||deckWords(id);if(!ws.length){toast('No words in this deck');return}
 const dir=(store.get('zt-fc-dir'))||'de';
 F={id,title:deckTitle(id),list:shuffle([...ws]),i:0,flip:false,dir,miss:[],ok:0};drawCard();window.scrollTo(0,0);
}
function drawCard(){
 clearInterval(tick);
 if(F.i>=F.list.length)return fcDone();
 const w=F.list[F.i],de=F.dir==='de';
 const front=de?`<div class="word">${colorDe(w[0])}</div>${w[1]?`<div class="pl">${esc(w[1])}</div>`:''}`:`<div class="tr">${esc(w[2])}</div><div class="tr2">${esc(w[3])}</div>`;
 const back=de?`<div class="tr">${esc(w[2])}</div><div class="tr2">${esc(w[3])}</div>`:`<div class="word">${colorDe(w[0])}</div>${w[1]?`<div class="pl">${esc(w[1])}</div>`:''}`;
 const sayBtn='<button class="say" data-say aria-label="Pronounce"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0014 8v8a4.5 4.5 0 002.5-4z"/></svg></button>';
 app.innerHTML=`<div class="bar"><div><span class="note">Flashcards</span><h2>${esc(F.title)}</h2></div><button class="btn sm ghost" id="home">Back</button></div>
 <div class="fcbar"><span class="note">Card ${F.i+1} of ${F.list.length} · known ${F.ok} · to repeat ${F.miss.length}</span>
 <div class="seg"><button data-dir="de" class="${de?'on':''}">DE → RU/EN</button><button data-dir="ru" class="${de?'':'on'}">RU/EN → DE</button></div></div>
 <div class="fc ${F.flip?'flip':''}" id="card"><div class="fcin"><div class="face front">${front}${de?sayBtn:''}<div class="hint">Tap the card to flip</div></div><div class="face back">${back}${de?'':sayBtn}</div></div></div>
 <div class="kb"><button class="btn ghost" id="no">✕ Don’t know</button><button class="btn" id="yes">✓ Know</button></div>
 <p class="legend">Colours: <b class="m">der</b> masculine · <b class="f">die</b> feminine · <b class="n">das</b> neuter. Keys: Space = flip, ← = don’t know, → = know.</p>`;
 document.getElementById('home').onclick=()=>{F=null;home()};

/* ---------- ответы и разбор ---------- */
function ansText(q,a){
 const empty=a==null||a===''||(Array.isArray(a)&&!a.some(x=>x!=null&&x!==''));
 if(empty)return '— (no answer)';
 switch(q.t){
  case 'mc':return q.o[a];
  case 'tf':return a?'Wahr':'Falsch';
  case 'multi':return a.map(x=>x||'…').join(', ');
  case 'sel':return q.rows.map((r,k)=>`${r[0].replace(/<[^>]+>/g,'').replace('___','['+(a[k]||'…')+']')}`).join(' / ');
  case 'gap':return a.map(x=>x||'…').join(', ');
  case 'order':return a.map(i=>q.w[i]).join(' ');
  case 'read':return q.rows.map((r,k)=>`${r[0]} → ${a[k]==null?'…':a[k]?'richtig':'falsch'}`).join(' / ');
  case 'listen':return q.rows?q.rows.map((r,k)=>`${r[0]} → ${a[k]==null?'…':a[k]?'richtig':'falsch'}`).join(' / '):q.o[a];
 }
 return String(a);
}
function rightText(q){
 switch(q.t){
  case 'mc':return q.o[q.a];
  case 'tf':return q.a?'Wahr':'Falsch';
  case 'fill':return q.show||q.a[0];
  case 'short':case 'order':return q.show||q.a[0];
  case 'multi':return q.a.map(x=>x[0]).join(', ');
  case 'sel':return q.rows.map(r=>r[0].replace(/<[^>]+>/g,'').replace('___','['+r[1]+']')).join(' / ');
  case 'gap':return q.a.join(', ');
  case 'read':return q.rows.map(r=>`${r[0]} → ${r[1]?'richtig':'falsch'}`).join(' / ');
  case 'listen':return q.rows?q.rows.map(r=>`${r[0]} → ${r[1]?'richtig':'falsch'}`).join(' / '):q.o[q.a];
 }
 return '';
}
function fbHTML(q,qi){
 const a=S.ans[qi],g=grade(q,a),c=cls(g);
 const t=g===null?'Check with the list or send it to Claude':g>=1?'Correct':g>0?`Partly: ${Math.round(g*100)}%`:'Wrong';
 const script=q.t==='listen'?`<div class="script"><b>Transcript:</b>${q.lines.map(l=>`<p>${q.lines.length>1?`<b>${esc(l[0])}:</b> `:''}${esc(l[1])}</p>`).join('')}</div>`:'';
 if(q.t==='essay')return `<div class="fb p"><b class="t">${t}</b><div>Checklist:</div><ul>${q.check.map(c=>`<li>${esc(c)}</li>`).join('')}</ul><div>Model answer: <i>${esc(q.model)}</i></div></div>`;
 return `<div class="fb ${c}"><b class="t">${t}</b><div>Your answer: <span class="ans">${esc(ansText(q,a))}</span></div>
 <div>Correct answer: <span class="ans">${esc(rightText(q))}</span></div>${script}<p>${q.ex||''}</p></div>`;
}
function askText(q,qi){return `Question from the trainer (${T.title}):\n${(q.q||'').replace(/___/g,'___')}${q.grid?'\n'+q.grid:''}${q.text?'\nТекст: '+q.text:''}\nМой ответ: ${ansText(q,S.ans[qi])}\nОбъясни, пожалуйста: `}

 clearInterval(tick);
 const pct=S.pct,note=pct>=86?'sehr gut':pct>=74?'gut':pct>=62?'befriedigend':pct>=50?'genügend':'nicht genügend';
 const used=S.mode==='exam'?fmtT(Math.min(LIMIT,Math.floor(((S.end||Date.now())-S.start)/1000))):null;
 const wrong=S.order.filter(k=>{const g=grade(T.items[k],S.ans[k]);return g===null||g<1});
 app.innerHTML=`<div class="bar"><h1>Result · ${esc(T.title)}</h1><button class="btn sm ghost" id="home">All tests</button></div>
 <section class="paper"><div class="score">${pct}%</div>
 <p style="margin:6px 0 0;font-size:19px"><b>${note}</b> · ${(Math.round(S.pts*10)/10).toString().replace('.',',')} of ${S.max} points${used?` · time ${used}`:''}</p>
 <p class="note">Course scale: 86% sehr gut, 74% gut, 62% befriedigend, 50% genügend. The essay is not included in the percentage; the teacher grades it.</p>
 <div class="btns"><button class="btn red" id="again">Start over</button><button class="btn ghost" id="wrong">Copy mistakes for Claude</button></div></section>
 <section class="paper"><h2>Review</h2>${S.order.map((k,j)=>{const q=T.items[k],c=cls(grade(q,S.ans[k]));return `<details class="rq" ${c!=='r'?'open':''}><summary><span class="dot" style="background:var(--${c==='r'?'ok':c==='w'?'bad':'part'})"></span><span><b>${j+1}.</b> ${esc((q.q||'').split('\n')[0])}</span></summary>${fbHTML(q,k)}</details>`}).join('')}</section>`;
 document.getElementById('home').onclick=home;
 document.getElementById('again').onclick=()=>{store.del(key(T.id));home()};
 document.getElementById('wrong').onclick=()=>{
  const lines=wrong.map(k=>{const q=T.items[k];return `• ${(q.q||'').replace(/\n/g,' ')}${q.t==='essay'?'\n  мой текст: '+(S.ans[k]||''):'\n  мой ответ: '+ansText(q,S.ans[k])}`});
  copy(`Результат (${T.title}): ${pct}%.\nРазбери со мной ошибки:\n${lines.join('\n')}`,'Copied — paste it into the chat')};
}
home();
}
</script>
</body>
</html>
